name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
            VERSION="${LATEST_TAG}"
            PATCH=$(echo $VERSION | cut -d. -f3)
            MAJOR_MINOR=$(echo $VERSION | cut -d. -f1,2)
            NEW_PATCH=$((PATCH + 1))
            VERSION="${MAJOR_MINOR}.${NEW_PATCH}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version ${VERSION}"

      - name: Build binaries
        run: |
          mkdir -p bin
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-X main.Version=${{ steps.version.outputs.VERSION }} -X main.BuildTime=${BUILD_TIME}"
          
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/drim_Linux_x86_64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/drim_Linux_arm64 .
          
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/drim_Darwin_x86_64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/drim_Darwin_arm64 .
          
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/drim_Windows_x86_64.exe .

      - name: Create tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          files: bin/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
