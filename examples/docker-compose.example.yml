services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - kaneo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The unified Kaneo image serves both the web app and API on port 5173.
  # `expose` makes 5173 reachable only on the `kaneo` Docker network, which is
  # the correct setup when Caddy (or any containerized reverse proxy on the same
  # network) proxies requests to `http://kaneo:5173`. To reach Kaneo directly
  # without Caddy, generate the compose with the reverse-proxy prompt set to
  # "No"; drim then publishes 5173 to the host (see MIGRATION.md Step 11).
  kaneo:
    image: ghcr.io/usekaneo/kaneo:latest
    env_file: .env
    expose:
      - "5173"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kaneo

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kaneo
    networks:
      - kaneo

# Set KANEO_CLIENT_URL to the public URL in `.env`. With this compose file
# (Caddy on the `kaneo` network, no host port published) use:
#   http://localhost     -> Caddy on the host (ports 80/443)
#   http://kaneo:5173    -> another container on the `kaneo` network
volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  kaneo:
    driver: bridge
