services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - kaneo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The unified Kaneo image serves both the web app and API on port 5173.
  kaneo:
    image: ghcr.io/usekaneo/kaneo:latest
    env_file: .env
    expose:
      - "5173"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kaneo

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kaneo
    networks:
      - kaneo

# Set KANEO_CLIENT_URL to the public URL in .env. For local use, set it to
# http://localhost (Caddy) or http://localhost:5173 without Caddy.
volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  kaneo:
    driver: bridge
